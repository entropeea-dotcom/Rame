function onHand(L){

  poseHist.push({t:now,p:upose});while(poseHist.length&&now-poseHist[0].t>1800)poseHist.shift();
  ycHist.push({t:now,y:(L[0].y+L[9].y)/2});while(ycHist.length&&now-ycHist[0].t>1500)ycHist.shift();
  handDbg=`размах ${scale.toFixed(2)} рост ${gr.toFixed(2)} поза ${upose||'-'}`;
  if(upose==='rock'){if(!rock0)rock0=now}else rock0=0;
  if(rock0&&now-rock0>600&&now-lastRps>3500&&!['rps','handsup','shot','crazy','hide','panic','peek','spin','exit','wake','startle'].includes(st)){
    rock0=0;go('rps',12000,{phase:'pump',count:0,tb:now,period:.62});
  }

  // --- жест «крутит у виска»: указательный у виска делает круги ---

    const tp=L[8],dT=Math.min(Math.hypot(tp.x-face.tl.x,tp.y-face.tl.y),Math.hypot(tp.x-face.tr.x,tp.y-face.tr.y));

      }

  }else twHist=[];
  
  // палец указывает в сторону: существо уходит за край экрана
  const ext=(a,b,c)=>Math.hypot(L[a].x-L[c].x,L[a].y-L[c].y)>Math.hypot(L[b].x-L[c].x,L[b].y-L[c].y)*1.15;
  const dxp=L[8].x-L[5].x,dyp=L[8].y-L[5].y;
  const pointing=ext(8,6,0)&&!ext(12,10,0)&&!ext(16,14,0)&&Math.abs(dxp)>Math.abs(dyp)*2&&Math.hypot(dxp,dyp)>.05;

let ys=0,ps=0,rs=0,pys=0,yb=0,pb=0,rb=0,pyb=0,faceHist=[],expC=null,expT=0,lastMir=0,bsm={},bsl={};
const sm=(k,v)=>{bsm[k]=bsm[k]===undefined?v:bsm[k]*.5+v*.5;return bsm[k]};
function turns(key,th){

  for(const h of faceHist){
    const v=h[key];

function headGesture(){

  const r=faceHist.filter(h=>now-h.t<700);
  if(r.length>=5){
    const rg=k=>Math.max(...r.map(h=>h[k]))-Math.min(...r.map(h=>h[k]));

function mirror(kind,dur){

  else go('mirror',dur,{kind});
}
function onFace(L,bs){

  const rr=Math.atan2(L[263].y-L[33].y,L[263].x-L[33].x),ry=(n.x-(L[234].x+L[454].x)/2)/wd,rp=(n.y-(L[10].y+L[152].y)/2)/hd;

function updateState(){
  if(stDur&&now-st0>stDur){
    const n=st;
    if(n==='panic')go('hide',3000+rnd()*2500,{},true);
    else if(n==='hide')go('peek',2800,{},true);
    else if(n==='peek')go('awake',0,{},true);
    else if(n==='drowsy')go('sleep',0,{},true);
    else if(n==='startle')go('wary',2200,{side:1},true);
    else go('awake',0,{},true);
  }
  const seen=Math.max(faceSeen,handSeen,lastT,lastClap,lastAct);
  absent=camOK?now-Math.max(seen,t00)>12000:now-Math.max(lastT,lastClap,lastAct,t00)>20000;
  const bored=now-Math.max(lastT,handSeen,lastClap,lastMir,lastAct,t00)>40000;
  if((absent||bored)&&(st==='awake'||st==='wary'||st==='wave'))go('drowsy',9500,{b:bored&&!absent},true);
  if(st==='drowsy'&&!stArg.b&&faceFresh())go('awake',0,{},true);
  if(st==='awake'){
    courage=Math.min(1,courage+.00003);
    if(now-lastT>(lastEmo==='purr'?2000:3000)){touchEmo=null;purrOff()}
  }
}

function glow(){g.shadowColor='#5ff5ff';g.shadowBlur=U*.06*Math.max(.2,cur.gl);g.strokeStyle=g.fillStyle=cur.gl>1.3?'#c4fcff':cur.gl<.7?'#6fd9e3':'#8ffaff'}

function drawRArm(cx,cy,t){

    g.beginPath();g.moveTo(S0[0],S0[1]);g.lineTo(E2[0],E2[1]);g.lineTo(F[0],F[1]);g.stroke();
    g.beginPath();g.arc(F[0],F[1],.05*U,0,6.3);g.stroke();
    g.beginPath();g.moveTo(F[0]-.03*U,F[1]-.03*U);g.lineTo(T[0],T[1]);g.stroke();

    const tp=[tb[0]+Math.cos(t*14)*.03*U,tb[1]+Math.sin(t*14)*.03*U];

    g.beginPath();g.arc(F[0],F[1],.05*U,0,6.3);g.stroke();
    g.beginPath();g.moveTo(F[0]-.03*U,F[1]-.04*U);g.lineTo(tp[0],tp[1]);g.stroke();

function drawRps(cx,cy){

function draw(t){

    const lid=s<0?cur.lidL:cur.lidR;
    const eh=Math.max(.2*U*cur.eye*lid*(1-blink),.014*U);

    const lw=.085*U,u1=.06*U,l1=.085*U;
    g.lineJoin='round';
    g.moveTo(-lw,my);
    g.quadraticCurveTo(-lw*.55,my-u1*1.2,-lw*.12,my-u1*.8);
    g.quadraticCurveTo(0,my-u1*.5,lw*.12,my-u1*.8);
    g.quadraticCurveTo(lw*.55,my-u1*1.2,lw,my);
    g.bezierCurveTo(lw*.9,my+l1*1.05,-lw*.9,my+l1*1.05,-lw,my);
    g.closePath();g.fill();
    g.beginPath();g.strokeStyle='#05070a';g.lineWidth=.012*U;
    g.moveTo(-lw*.82,my+.002*U);g.quadraticCurveTo(0,my+.016*U,lw*.82,my+.002*U);g.stroke();
    g.strokeStyle=g.fillStyle;
    g.beginPath();
  }else if(cur.teeth>.3&&cur.open>.08){
    // детская улыбка: ровный верх, круглый низ и ряд маленьких зубок
    const hw=.2*U*cur.w,dpt=Math.max(.2,cur.curve)*.09*U,depth=cur.open*.6*U+dpt/2;
    g.lineJoin='round';
    g.moveTo(-hw,my);g.quadraticCurveTo(0,my+dpt,hw,my);
    g.bezierCurveTo(hw*.98,my+depth*.72,hw*.5,my+depth,0,my+depth);
    g.bezierCurveTo(-hw*.5,my+depth,-hw*.98,my+depth*.72,-hw,my);g.closePath();
    tooth={hw,dpt,depth};
  }
  else if(cur.open>.1&&cur.curve>.55){const hw=.2*U*cur.w,dp=cur.curve*.2*U;g.moveTo(-hw,my);g.quadraticCurveTo(0,my+dp,hw,my);g.quadraticCurveTo(0,my+dp+cur.open*.4*U,-hw,my);g.closePath()}
  else if(cur.open>.1)g.ellipse(0,my,.1*U*cur.w+.02*U,.11*U*cur.open,0,0,Math.PI*2);
  else{const hw=.2*U*cur.w;g.moveTo(-hw,my);g.quadraticCurveTo(0,my+cur.curve*.2*U,hw,my)}
  g.stroke();
  if(tooth){
    const {hw,dpt,depth}=tooth,N=4,tw=.052*U,gap=.01*U,span=N*tw+(N-1)*gap,th=Math.min(.055*U,depth*.4);
    g.save();g.shadowBlur=0;g.clip();
    for(let i=0;i<N;i++){
      const x=-span/2+i*(tw+gap),u=(x+tw/2)/hw,yTop=my+dpt*(1-u*u)/2;
      g.beginPath();g.roundRect(x,yTop-.004*U,tw,th,[0,0,tw*.4,tw*.4]);g.fill();
    }
    g.restore();glow();
  }
  if(cur.tongue>.3){
    const tw2=.07*U,hw2=.2*U*cur.w;
    g.save();g.globalAlpha*=Math.min(1,cur.tongue);
    g.beginPath();g.roundRect(cur.tpos<.1?-tw2/2:hw2*cur.tpos,my-.01*U,tw2,.095*U,[0,0,tw2*.5,tw2*.5]);g.fill();
    g.restore();
  }
  g.restore();
  g.restore();
  if(cur.arms>.02){
    g.save();glow();g.globalAlpha=Math.min(1,cur.arms)*Math.max(0,Math.min(1,cur.a));
    g.lineWidth=.03*U;g.lineCap='round';g.lineJoin='round';
    const rise=(1-Math.min(1,cur.arms))*.9*U,tr=st==='handsup'?Math.sin(t*45)*.006*U:0;
    for(const sd of[-1,1]){
      const hx=cx+sd*.37*U+tr,hy=cy+.1*U+rise;
      g.beginPath();g.moveTo(cx+sd*.26*U+tr,cy+.8*U+rise);g.lineTo(cx+sd*.42*U+tr,cy+.45*U+rise);g.lineTo(hx,hy);g.stroke();
      g.beginPath();g.arc(hx,hy-.01*U,.045*U,0,Math.PI*2);g.stroke();
      for(const a of[-.55,-.2,.2,.55]){g.beginPath();g.moveTo(hx+Math.sin(a)*.05*U,hy-.01*U-Math.cos(a)*.05*U);g.lineTo(hx+Math.sin(a)*.1*U,hy-.01*U-Math.cos(a)*.1*U);g.stroke()}
    }
    g.restore();
  }
  drawRArm(cx,cy,t);
  if(rpsHand)drawRps(cx,cy);
  zs=zs.filter(z=>now-z.t0<3300);
  if(zs.length){
    g.save();glow();
    for(const z of zs){
      const q=(now-z.t0)/3200;
      if(q<0||q>1)continue;
      const sz=U*(.05+.075*q);
      g.globalAlpha=Math.min(1,q*5)*(1-q);
      g.font=`italic bold ${sz}px system-ui,sans-serif`;
      g.fillText(z.k%2?'Z':'z',cx+.3*U+q*.14*U+Math.sin(q*7+z.k)*.025*U,cy+.1*U-q*.3*U);
    }
    g.restore();
  }
}

function drawDbg(){
  if(!dbg)return;
  g.save();g.shadowBlur=0;g.fillStyle='#8ffaff';g.font='12px monospace';
  const T=[`v9 state:${st} cam:${camOK} mic:${micOK} audio:${ac&&ac.state}`,
    `hand:${handFresh()?'yes':'no'} size:${hand?hand.sz.toFixed(2):'-'} speed:${hand?hand.v.toFixed(2):'-'}`,
    `face:${faceFresh()?'yes':'no'} peak:${lastPk.toFixed(2)} avg:${avg.toFixed(3)} claps:${claps.length}`,
    `absent:${absent} courage:${courage.toFixed(2)}`,
    `gun: ${handFresh()?gunDbg:'рука не видна'}`,
    `hand: ${handFresh()?handDbg:'-'}`,
    `цу-е-фа: ${rpsLast||'-'}`,
    `exp:${face&&face.kind||'-'} smile:${face?face.smile.toFixed(2):'-'} jaw:${face?face.jaw.toFixed(2):'-'}`,
    `brow-down:${face?face.bd.toFixed(2):'-'} frown:${face?face.frown.toFixed(2):'-'} brow-up:${face?face.bi.toFixed(2):'-'}`];
  T.forEach((x,i)=>g.fillText(x,10,24+i*16));
  if(lastHandL&&handFresh()){
    g.fillStyle='#ffe066';for(const q of lastHandL){g.beginPath();g.arc((1-q.x)*W,q.y*H,3,0,6.3);g.fill()}
    g.fillStyle='#ff5a5a';g.beginPath();g.arc((1-lastHandL[8].x)*W,lastHandL[8].y*H,6,0,6.3);g.fill();
  }
  g.restore();
}
/* ---------- главный цикл ---------- */
let t00=0;
function detect(){
  if(!camOK||document.hidden||vid.readyState<2||now-lastDet<45)return;
  lastDet=now;detTick++;
  try{
    if(detTick%2&&handLM){const r=handLM.detectForVideo(vid,now);if(r.landmarks&&r.landmarks[0])onHand(r.landmarks[0]);else if(hand&&hand.scale>.45&&hand.gr>1.15&&now-handSeen<500&&!['panic','hide','sleep','drowsy','wake','handsup','shot'].includes(st))go('panic',1300,{v:Math.floor(rnd()*3),side:hand.x<.5?1:-1})}
    else if(faceLM){const r=faceLM.detectForVideo(vid,now);if(r.faceLandmarks&&r.faceLandmarks[0])onFace(r.faceLandmarks[0],r.faceBlendshapes&&r.faceBlendshapes[0])}
  }catch(e){}
}
const vel={ox:0,oy:0,tilt:0,sc:0,yaw:0,pitch:0,arms:0};
function frame(ms){
  now=ms;const t=ms/1000;
  mic();detect();updateState();beh(t);
  for(const k in cur){
    if(k in vel){vel[k]=vel[k]*.62+(tgt[k]-cur[k])*spd*.95;cur[k]+=vel[k]}
    else cur[k]+=(tgt[k]-cur[k])*spd;
  }
  gx+=(tx-gx)*gk;gy+=(ty-gy)*gk;
  if(blinkStart<0&&now>nextBlink)blinkStart=now;
  if(blinkStart>=0){
    const q=(now-blinkStart)/blinkDur;
    if(q>=1){blinkStart=-1;blink=0;nextBlink=now+2000+rnd()*3500;blinkDur=120+rnd()*180}
    else blink=Math.sin(Math.PI*q);
  }
  draw(t);drawDbg();
  requestAnimationFrame(frame);
}

/* ---------- запуск ---------- */
async function mk(cls,fs,url){
  const base=m=>({baseOptions:{modelAssetPath:url,delegate:m},runningMode:'VIDEO',numHands:1,numFaces:1,minHandDetectionConfidence:.25,minHandPresenceConfidence:.25,minTrackingConfidence:.25,minFaceDetectionConfidence:.4,minFacePresenceConfidence:.4,outputFaceBlendshapes:true});
  try{return await cls.createFromOptions(fs,base('GPU'))}catch(e){return await cls.createFromOptions(fs,base('CPU'))}
}
let stream=null;
async function start(){
  goBtn.remove();unlock();
  const audio={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
  const tries=[{video:{facingMode:'user',width:640,height:480},audio},{video:{facingMode:'user',width:640,height:480}},{audio}];
  for(const c of tries){try{stream=await navigator.mediaDevices.getUserMedia(c);break}catch(e){}}
  t00=performance.now();
  requestAnimationFrame(frame);
  if(!stream)return; // нет доступа: остаются только касания
  if(stream.getAudioTracks().length&&ac){
    const src=ac.createMediaStreamSource(stream);an=ac.createAnalyser();an.fftSize=1024;abuf=new Uint8Array(an.fftSize);src.connect(an);const z=ac.createGain();z.gain.value=0;an.connect(z);z.connect(ac.destination);ac.resume();micOK=true;
  }
  if(stream.getVideoTracks().length){
    vid.srcObject=new MediaStream(stream.getVideoTracks());
    try{await vid.play()}catch(e){}
    try{
      const fs=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
      handLM=await mk(HandLandmarker,fs,'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task');
      faceLM=await mk(FaceLandmarker,fs,'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task');
      camOK=true;
    }catch(e){camOK=false}
  }
}
goBtn.addEventListener('click',start);
function stopAll(){if(stream)stream.getTracks().forEach(k=>k.stop());purrOff()}
addEventListener('pagehide',stopAll);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(ac&&ac.state==='suspended')ac.resume();if(stream&&vid.paused)vid.play().catch(()=>{})}});
</script>
