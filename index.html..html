<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Смайлик</title>
<style>
:root{color-scheme:dark;--bg:#05070a;--glow:#5ff5ff;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,U;
function fit(){
  const d=devicePixelRatio||1;
  W=innerWidth;H=innerHeight;
  cv.width=W*d;cv.height=H*d;
  g.setTransform(d,0,0,d,0,0);
  U=Math.min(W,H*0.7);
}
addEventListener('resize',fit);fit();

const E={
  happy :{curve:.8, open:0,  eye:1,   brow:0,  lift:0, w:1,  shake:0},
  wow   :{curve:0,  open:1,  eye:1.35,brow:0,  lift:1, w:.5, shake:0},
  angry :{curve:-.25,open:0, eye:.7,  brow:1,  lift:-.3,w:.9,shake:0},
  scared:{curve:-.2,open:.45,eye:1.3, brow:-1, lift:1, w:.8, shake:1},
  purr  :{curve:.9, open:0,  eye:.07, brow:0,  lift:-.2,w:1.05,shake:0}
};
const cur={...E.happy},tgt={...E.happy};
let gx=0,gy=0,tx=0,ty=0;
let blink=0,blinkStart=-1,nextBlink=2;
let lastTouch=-99;
let down=false,downInfo=null,path=[],taps=[];

let ac=null,lastEmo='happy',lastSnd=0;
function unlock(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}}
  if(ac.state==='suspended')ac.resume();
}
function tone(f1,f2,dur,type,vol,vib){
  const o=ac.createOscillator(),gn=ac.createGain(),t=ac.currentTime;
  o.type=type;
  o.frequency.setValueAtTime(f1,t);
  o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  gn.gain.setValueAtTime(.0001,t);
  gn.gain.exponentialRampToValueAtTime(vol,t+.02);
  gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  if(vib){
    const l=ac.createOscillator(),lg=ac.createGain();
    l.frequency.value=vib;lg.gain.value=f1*.08;
    l.connect(lg);lg.connect(o.frequency);l.start(t);l.stop(t+dur);
  }
  o.connect(gn);gn.connect(ac.destination);
  o.start(t);o.stop(t+dur+.02);
}
function sound(n){
  if(!ac||ac.state!=='running')return;
  if(n==='happy'){tone(520,780,.14,'sine',.18);setTimeout(()=>tone(700,1050,.16,'sine',.16),130)}
  else if(n==='wow'){tone(400,1100,.22,'sine',.2)}
  else if(n==='angry'){tone(150,90,.45,'sawtooth',.14,28)}
  else if(n==='scared'){tone(900,1200,.5,'triangle',.14,14)}
}
let purr=null;
function purrOn(){
  if(!ac||ac.state!=='running'||purr)return;
  const o=ac.createOscillator(),f=ac.createBiquadFilter(),am=ac.createGain(),m=ac.createGain(),l=ac.createOscillator(),lg=ac.createGain();
  o.type='sawtooth';o.frequency.value=70;
  f.type='lowpass';f.frequency.value=500;
  am.gain.value=.06;
  l.frequency.value=24;lg.gain.value=.05;
  l.connect(lg);lg.connect(am.gain);
  m.gain.value=0;
  o.connect(f);f.connect(am);am.connect(m);m.connect(ac.destination);
  o.start();l.start();
  m.gain.setTargetAtTime(1,ac.currentTime,.2);
  purr={o,l,m};
}
function purrOff(){
  if(!purr)return;
  const p=purr,t=ac.currentTime;
  purr=null;
  p.m.gain.setTargetAtTime(0,t,.1);
  p.o.stop(t+.6);p.l.stop(t+.6);
}
function feel(n,quiet,force){
  const now=performance.now();
  if(!quiet&&(n!==lastEmo||force)&&now-lastSnd>300){lastSnd=now;sound(n)}
  lastEmo=n;
  if(n==='purr')purrOn();else purrOff();
  Object.assign(tgt,E[n]);
}
function setGaze(x,y){tx=(x/W-.5)*2;ty=(y/H-.5)*2;lastTouch=performance.now()/1000}

// хаотичные движения (много разворотов на скорости) = страх, плавные = ласка
let stroke0=0;
function analyze(){
  const now=performance.now();
  while(path.length&&now-path[0].t>700)path.shift();
  if(path.length<4)return;
  let L=0,rev=0,pv=null;
  for(let i=1;i<path.length;i++){
    const vx=path[i].x-path[i-1].x,vy=path[i].y-path[i-1].y,l=Math.hypot(vx,vy);
    if(l<4)continue;
    L+=l;
    if(pv&&vx*pv.x+vy*pv.y<0)rev++;
    pv={x:vx,y:vy};
  }
  const dt=(path[path.length-1].t-path[0].t)/1000||1;
  const sp=L/dt;
  if(rev>=4&&sp>400)feel('scared');
  else if(L>40&&rev<=2&&sp<900){if(!stroke0)stroke0=now;if(now-stroke0>=500)feel('purr')}else stroke0=0;
}

cv.addEventListener('pointerdown',e=>{
  down=true;unlock();stroke0=0;
  downInfo={t:performance.now(),moved:0,x:e.clientX,y:e.clientY};
  path=[{x:e.clientX,y:e.clientY,t:performance.now()}];
  setGaze(e.clientX,e.clientY);
});
cv.addEventListener('pointermove',e=>{
  setGaze(e.clientX,e.clientY);
  if(!down)return;
  downInfo.moved+=Math.hypot(e.clientX-downInfo.x,e.clientY-downInfo.y);
  downInfo.x=e.clientX;downInfo.y=e.clientY;
  path.push({x:e.clientX,y:e.clientY,t:performance.now()});
  analyze();
});
cv.addEventListener('pointerup',e=>{
  if(!down)return;
  down=false;
  const now=performance.now();
  // короткое касание: по лицу несколько раз = злость, одиночное = удивление
  if(downInfo.moved<12&&now-downInfo.t<350){
    taps.push({t:now,near:Math.hypot(e.clientX-W/2,e.clientY-H/2)<.5*U});
    taps=taps.filter(k=>now-k.t<1000);
    const knocks=taps.filter(k=>k.near).length;
    feel(knocks>=(lastEmo==='angry'?3:4)?'angry':'wow',false,true);
  }
});
cv.addEventListener('pointercancel',()=>{down=false});

function glow(){g.shadowColor='#5ff5ff';g.shadowBlur=U*.06;g.strokeStyle=g.fillStyle='#8ffaff'}

function frame(ms){
  const t=ms/1000;

  if(t-lastTouch>(lastEmo==='purr'?2:3)){feel('happy',true);tx=0;ty=0}
  for(const k in cur)cur[k]+=(tgt[k]-cur[k])*.12;
  gx+=(tx-gx)*.18;gy+=(ty-gy)*.18;

  if(blinkStart<0&&t>nextBlink){blinkStart=t}
  if(blinkStart>=0){
    const p=(t-blinkStart)/.18;
    if(p>=1){blinkStart=-1;blink=0;nextBlink=t+2+Math.random()*3}
    else blink=Math.sin(Math.PI*p);
  }

  g.clearRect(0,0,W,H);
  glow();
  const float=Math.sin(t*1.6)*.012*U;
  const cx=W/2+gx*.015*U+Math.sin(t*60)*.006*U*cur.shake;
  const cy=H/2+float+Math.cos(t*53)*.006*U*cur.shake;

  const ew=.15*U;
  const eh=Math.max(.2*U*cur.eye*(1-blink),.014*U);
  const ey=cy-.12*U;
  for(const s of[-1,1]){
    const ex=cx+s*.22*U;
    g.beginPath();
    g.roundRect(ex-ew/2,ey-eh/2,ew,eh,ew/2);
    g.fill();

    // зрачок цвета фона, ходит внутри глаза за пальцем
    g.save();
    g.shadowBlur=0;
    g.clip();
    g.fillStyle='#05070a';
    g.beginPath();
    g.arc(ex+gx*.03*U,ey+gy*Math.max(eh/2-.04*U,0),.04*U,0,Math.PI*2);
    g.fill();
    g.restore();
    glow();

    const by=ey-.2*U-cur.lift*.04*U-(eh-.2*U)/2;
    g.lineWidth=.035*U;g.lineCap='round';
    g.beginPath();
    g.moveTo(ex+s*.09*U,by);
    g.lineTo(ex-s*.09*U,by+cur.brow*.05*U);
    g.stroke();
  }

  const mx=cx, my=cy+.2*U;
  g.lineWidth=.035*U;g.lineCap='round';
  g.beginPath();
  if(cur.open>.1){
    g.ellipse(mx,my,.1*U*cur.w+.02*U,.11*U*cur.open,0,0,Math.PI*2);
  }else{
    const hw=.2*U*cur.w;
    g.moveTo(mx-hw,my);
    g.quadraticCurveTo(mx,my+cur.curve*.2*U,mx+hw,my);
  }
  g.stroke();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
